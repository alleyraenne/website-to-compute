<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aetherwood Academy: Character Creation</title>
  <style>
    body {
      background: url('https://i.imgur.com/qFj1n9R.jpeg') no-repeat center center fixed;
      background-size: cover;
      font-family: "Cinzel", serif;
      color: #f3efe3;
      text-align: center;
      padding: 50px;
    }
    .container {
      background-color: rgba(30, 61, 48, 0.85);
      padding: 30px;
      border-radius: 10px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 15px #e6c17b;
    }
    label, input, select, textarea {
      display: block;
      width: 100%;
      margin-bottom: 20px;
      font-size: 16px;
    }
    input, select, textarea {
      padding: 10px;
      border: none;
      border-radius: 5px;
    }
    button {
      background-color: #e6c17b;
      color: #1e3d30;
      font-weight: bold;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    h1 {
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to Aetherwood Academy</h1>
    <p>Create your student record below:</p>
    <label for="charName">Full Name</label>
    <input type="text" id="charName" placeholder="Alora Duskfall">

    <label for="wand">Wand Description</label>
    <input type="text" id="wand" placeholder="Rowan, 11 inches, Phoenix Feather">

    <label for="familiar">Familiar</label>
    <select id="familiar">
      <option>Owl</option>
      <option>Cat</option>
      <option>Raven</option>
      <option>Fox</option>
      <option>Snake</option>
      <option>Custom</option>
    </select>

    <label for="affinity">Magical Affinities</label>
    <input type="text" id="affinity" placeholder="Shadow, Healing, Dreamwalking">

    <label for="backstory">Backstory</label>
    <textarea id="backstory" rows="4" placeholder="Tell us about your character's origins..."></textarea>

    <button onclick="saveCharacter()">Save & Continue</button>
  </div>

  <script>
    function saveCharacter() {
      const name = document.getElementById('charName').value;
      const wand = document.getElementById('wand').value;
      const familiar = document.getElementById('familiar').value;
      const affinity = document.getElementById('affinity').value;
      const backstory = document.getElementById('backstory').value;

      localStorage.setItem('aetherwoodName', name);
      localStorage.setItem('aetherwoodWand', wand);
      localStorage.setItem('aetherwoodFamiliar', familiar);
      localStorage.setItem('aetherwoodAffinity', affinity);
      localStorage.setItem('aetherwoodBackstory', backstory);

      window.location.href = "sorting.html"; // Link to your sorting ceremony page
    }
  </script>
</body>
</html>
